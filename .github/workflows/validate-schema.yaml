name: Validate schema

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    env:
      PYSTOW_HOME: ${{ github.workspace }}/.cache/pystow

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema and documentation tooling
        run: python -m pip install -r requirements.txt

      - name: Lint LinkML schema
        run: |
          # linkml-lint parses the schema and reports common LinkML issues.
          # Human-readable enum labels are expected in this draft schema, so
          # warnings do not fail CI; parse errors still fail.
          linkml-lint --ignore-warnings schemas/hrl_restoration_project.yaml

      - name: Generate JSON Schema smoke test
        run: |
          # gen-json-schema fails if the schema cannot be parsed or converted.
          mkdir -p /tmp/hrl-restoration-schema
          gen-json-schema schemas/hrl_restoration_project.yaml > /tmp/hrl-restoration-schema/hrl_restoration_project.schema.json

      - name: Generate LinkML documentation smoke test
        run: |
          # gen-doc fails if the schema reference documentation cannot be generated.
          gen-doc \
            --no-mergeimports \
            --no-render-imports \
            --truncate-descriptions false \
            --directory /tmp/hrl-restoration-schema/docs \
            schemas/hrl_restoration_project.yaml

      - name: Generate data dictionary smoke test
        run: |
          # The human-readable data dictionary must be reproducible from the
          # LinkML source schema.
          python scripts/generate_data_dictionary.py \
            --schema schemas/hrl_restoration_project.yaml \
            --output /tmp/hrl-restoration-schema/data_dictionary.md

      - name: Build MkDocs site smoke test
        run: |
          # Generate reference pages in-place for the build, then verify MkDocs.
          rm -rf docs/reference
          gen-doc \
            --no-mergeimports \
            --no-render-imports \
            --truncate-descriptions false \
            --directory docs/reference \
            schemas/hrl_restoration_project.yaml
          python scripts/generate_data_dictionary.py \
            --schema schemas/hrl_restoration_project.yaml \
            --output docs/data_dictionary.md
          mkdocs build --strict
