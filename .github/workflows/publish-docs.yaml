name: Publish documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYSTOW_HOME: ${{ github.workspace }}/.cache/pystow

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation tooling
        run: python -m pip install -r requirements.txt

      - name: Generate LinkML schema reference
        run: |
          # gen-doc writes Markdown pages for schema elements. The generated
          # files are used for the Pages build and are not committed.
          rm -rf docs/reference
          gen-doc \
            --no-mergeimports \
            --no-render-imports \
            --truncate-descriptions false \
            --directory docs/reference \
            schemas/hrl_restoration_project.yaml

      - name: Generate human-readable data dictionary
        run: |
          # The data dictionary is generated from the LinkML schema so it stays
          # aligned with field definitions, required flags, and vocabularies.
          python scripts/generate_data_dictionary.py \
            --schema schemas/hrl_restoration_project.yaml \
            --output docs/data_dictionary.md

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
