site_name: HRL Restoration Schema
site_url: https://healthy-rivers-and-landscapes-science.github.io/hrl-restoration-schema/
repo_url: https://github.com/Healthy-Rivers-and-Landscapes-Science/hrl-restoration-schema

nav:
  - Home: index.md
  - Schema overview: schema_overview.md
  - Data dictionary: data_dictionary.md
  - Submission guidance: submission_guidance.md
  - Geometry policy: geometry_policy.md
  - Business rules: business_rules.md
  - Validation interface: validation_interface.md
  - Schema reference: reference/index.md

theme:
  name: material

markdown_extensions:
  - md_in_html
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css
